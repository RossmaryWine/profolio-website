<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" fill="none">
  <style>
    .lbl { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #9AA3B2; }
    .lbl-sm { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #747E90; font-size: 10px; }
    .title { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #E3963E; font-size: 12px; letter-spacing: 0.08em; }
    .val { font-family: 'IBM Plex Mono', ui-monospace, monospace; fill: #E9ECF1; font-size: 11px; }
  </style>

  <!-- ============ Panel 1: First-fit free-list allocator ============ -->
  <text x="4" y="24" class="title">// HEAP — FIRST-FIT FREE LIST</text>

  <!-- heap strip -->
  <g transform="translate(4,40)">
    <!-- block 1: used -->
    <rect x="0" y="0" width="150" height="46" rx="2" fill="#8A5C28" opacity="0.35" stroke="#E3963E" stroke-width="1"/>
    <text x="8" y="18" class="lbl-sm">HDR</text>
    <text x="8" y="34" class="val">tid=2 · used</text>

    <!-- block 2: free -->
    <rect x="154" y="0" width="90" height="46" rx="2" fill="none" stroke="#3A4152" stroke-width="1" stroke-dasharray="3 3"/>
    <text x="162" y="18" class="lbl-sm">HDR</text>
    <text x="162" y="34" class="val">free</text>

    <!-- block 3: used -->
    <rect x="248" y="0" width="210" height="46" rx="2" fill="#8A5C28" opacity="0.35" stroke="#E3963E" stroke-width="1"/>
    <text x="256" y="18" class="lbl-sm">HDR</text>
    <text x="256" y="34" class="val">tid=4 · used</text>

    <!-- block 4: free (candidate for split) -->
    <rect x="462" y="0" width="130" height="46" rx="2" fill="none" stroke="#49B3A6" stroke-width="1.5"/>
    <text x="470" y="18" class="lbl-sm">HDR</text>
    <text x="470" y="34" class="val">free · split</text>

    <!-- block 5: used -->
    <rect x="596" y="0" width="90" height="46" rx="2" fill="#8A5C28" opacity="0.35" stroke="#E3963E" stroke-width="1"/>
    <text x="604" y="18" class="lbl-sm">HDR</text>
    <text x="604" y="34" class="val">tid=1</text>
  </g>

  <!-- freelist pointer arcs -->
  <g stroke="#49B3A6" stroke-width="1" fill="none" opacity="0.8">
    <path d="M 158 40 C 190 20, 210 20, 236 40" />
    <path d="M 462 40 C 500 15, 540 15, 592 40" />
  </g>
  <text x="4" y="112" class="lbl-sm">freelist_head → sorted by address · coalesces adjacent free neighbors on dealloc</text>

  <line x1="0" y1="132" x2="760" y2="132" stroke="#1B212B" stroke-width="1"/>

  <!-- ============ Panel 2: PendSV context switch ============ -->
  <text x="4" y="168" class="title">// PENDSV CONTEXT SWITCH</text>

  <g transform="translate(4,186)">
    <!-- Task A -->
    <rect x="0" y="0" width="140" height="64" rx="4" fill="#181D26" stroke="#3A4152"/>
    <text x="14" y="24" class="lbl-sm">TASK A</text>
    <text x="14" y="42" class="val">RUNNING</text>
    <circle cx="120" cy="16" r="4" fill="#49B3A6"/>

    <!-- arrow to SVC/SysTick -->
    <line x1="140" y1="32" x2="196" y2="32" stroke="#3A4152" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="146" y="24" class="lbl-sm">SVC / SysTick</text>

    <!-- PendSV trigger -->
    <rect x="200" y="0" width="150" height="64" rx="4" fill="#181D26" stroke="#E3963E"/>
    <text x="214" y="24" class="lbl-sm">PendSV_Handler</text>
    <text x="214" y="42" class="val">STMDB R4–R11</text>

    <line x1="350" y1="32" x2="406" y2="32" stroke="#3A4152" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Scheduler -->
    <rect x="410" y="0" width="150" height="64" rx="4" fill="#181D26" stroke="#3A4152"/>
    <text x="424" y="24" class="lbl-sm">osPendSVSwitch</text>
    <text x="424" y="42" class="val">EDF: min deadline</text>

    <line x1="560" y1="32" x2="616" y2="32" stroke="#3A4152" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Task B -->
    <rect x="620" y="0" width="140" height="64" rx="4" fill="#181D26" stroke="#3A4152"/>
    <text x="634" y="24" class="lbl-sm">TASK B</text>
    <text x="634" y="42" class="val">RUNNING</text>
    <circle cx="740" cy="16" r="4" fill="#49B3A6">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite" />
    </circle>
  </g>

  <text x="4" y="284" class="lbl-sm">LDMIA restores R4–R11 for incoming task · MSR PSP, R0 · BX LR (EXC_RETURN → Thread/PSP)</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#3A4152" />
    </marker>
  </defs>
</svg>
